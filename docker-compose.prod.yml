name: professional
services:
  authaudit:
    image: sha256:8b889ebba6c0a2b6c529b1fc29006d7fe7c9d32ffa39fa3e8badf7ace9e9849a
    pull_policy: never
    container_name: professional-authaudit
    user: 10001:10001
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=64m,mode=1777
    pids_limit: 512
    env_file:
    - .env
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8075/health',
        timeout=5)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    cpus: '1.0'
    restart: 'no'
    expose:
    - '8075'
    networks:
    - platform_edge
    - professional_net
networks:
  platform_edge:
    external: true
  professional_net:
    external: true
